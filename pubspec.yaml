name: madani
description: "Ihsan MADANI is a mobile application for the Ihsan MADANI project."
publish_to: "none"
version: 2.0.2+120

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  bloc: ^9.1.0
  bloc_concurrency: ^0.3.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  connectivity_plus: ^6.1.0
  chewie: ^1.8.5
  circular_countdown_timer: ^0.2.4
  collection: ^1.18.0
  device_info_plus: ^12.2.0
  dio: ^5.7.0
  equatable: ^2.0.5
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_custom_clippers: ^2.1.0
  flutter_gen: ^5.8.0
  flutter_inappwebview: ^6.1.5
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.10+1
  flutter_widget_from_html: ^0.17.1
  fluttertoast: ^9.0.0
  freezed: ^3.2.3
  freezed_annotation: ^3.1.0
  google_fonts: ^6.2.1
  hydrated_bloc: ^10.1.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  lazy_load_indexed_stack: ^1.1.0
  meta: 
  package_info_plus: ^9.0.0
  path_provider: ^2.1.4
  percent_indicator: ^4.2.3
  pod_player: ^0.2.2
  pretty_dio_logger: ^1.4.0
  shimmer: ^3.0.0
  syncfusion_flutter_charts: ^31.2.5
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  visibility_detector: ^0.4.0+2
  youtube_player_flutter: ^9.1.1

dev_dependencies:
  build_runner: ^2.4.13
  flutter_gen_runner: ^5.8.0
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  melos: ^7.3.0

flutter_gen:
  output: lib/src/generated_assets/
  integrations:
    flutter_svg: true
    rive: true
    lottie: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/media/icons/
    - assets/media/images/
    - assets/images/
  fonts:
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/Source_Sans_3/SourceSans3-Regular.ttf
        - asset: assets/fonts/Source_Sans_3/SourceSans3-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Source_Sans_3/SourceSans3-Bold.ttf
          weight: 700

# flutter_icons:
#   android: true
#   ios: true
#   image_path: "assets/images/ihsan-madani-portal-logo.png"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/im-icon-apps.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/im-icon-apps.png"